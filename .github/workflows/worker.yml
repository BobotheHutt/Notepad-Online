# Deploys Noteshack's online service (worker/, at api.noteshack.org) to Cloudflare
# when it changes. The tokens are the repository secrets CLOUDFLARE_API_TOKEN
# and NOTESHACK_ISSUES_TOKEN (the key problem reports are filed with).
name: Online service
on:
  push:
    branches: [main, 'claude/**']
    paths: ['worker/**', 'tools/worker.py', '.github/workflows/worker.yml']
  workflow_dispatch:
    inputs:
      test_report:
        description: Also send one test problem report (it is filed as a real issue)
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/worker.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTESHACK_ISSUES_TOKEN: ${{ secrets.NOTESHACK_ISSUES_TOKEN }}
      # it answers, translates, and turns other sites away (the new address
      # can take a minute to start answering)
      - name: Check it live
        run: |
          for i in $(seq 1 12); do
            out=$(curl -s -X POST https://api.noteshack.org/translate -H 'origin: https://noteshack.org' -H 'content-type: application/json' \
              -d '{"from":"en","to":"es","texts":["Good morning, how are you?"]}') || true
            echo "$out" | grep -q '"texts"' && break
            sleep 10
          done
          echo "$out"
          echo "$out" | grep -q '"texts":\["[^"]' || exit 1
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.noteshack.org/translate -H 'origin: https://example.com' -H 'content-type: application/json' -d '{}')
          echo "other site: $code"
          test "$code" = 403
          # reports: an empty one is turned away (a real one would be filed)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.noteshack.org/report -H 'origin: https://noteshack.org' -H 'content-type: application/json' -d '{"what":""}')
          echo "empty report: $code"
          test "$code" = 400
      - name: Send a test report
        if: ${{ inputs.test_report }}
        run: |
          curl -s -X POST https://api.noteshack.org/report -H 'origin: https://noteshack.org' -H 'content-type: application/json' \
            -d '{"what":"Test report from the deploy, to check reports reach GitHub. Close it.","steps":"","version":"test","browser":"GitHub Actions","lang":"en","website":""}' | tee out.json
          grep -q '"url":"https://github.com/' out.json
