<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad Online - Advanced Text Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="editor-container">
        <!-- Main Desktop Style Menu & Toolbar Wrapper -->
        <header class="toolbar">
            
            <!-- ====== 1. FILE MENU ====== -->
            <div class="dropdown">
                <button class="menu-trigger-btn">File ▾</button>
                <div class="dropdown-content menu-panel">
                    <button onclick="saveFile('txt')">💾 Save as .txt</button>
                    <button onclick="saveFile('html')">🌐 Save as .html</button>
                    <hr class="menu-divider">
                    <button onclick="printDoc()">🖨️ Print / PDF</button>
                    <hr class="menu-divider">
                    <button onclick="clearDoc()" class="text-danger">🗑️ Wiped / Clear Session</button>
                </div>
            </div>

            <!-- ====== 2. EDIT MENU ====== -->
            <div class="dropdown">
                <button class="menu-trigger-btn">Edit ▾</button>
                <div class="dropdown-content menu-panel">
                    <button onclick="format('undo')">↩ Undo</button>
                    <button onclick="format('redo')">↪ Redo</button>
                    <hr class="menu-divider">
                    <button onclick="format('bold')" style="font-weight: bold;">B Bold</button>
                    <button onclick="format('italic')" style="font-style: italic;">I Italic</button>
                    <button onclick="format('underline')" style="text-decoration: underline;">U Underline</button>
                    <button onclick="format('strikeThrough')" style="text-decoration: line-through;">~~ Strikethrough</button>
                </div>
            </div>

            <!-- ====== 3. VIEW MENU ====== -->
            <div class="dropdown">
                <button class="menu-trigger-btn">View ▾</button>
                <div class="dropdown-content menu-panel">
                    <button onclick="changeLayoutView('notepad')">🗔 Fullscreen Notepad Style</button>
                    <button onclick="changeLayoutView('page')">📄 Letter Page A4 Layout</button>
                    <hr class="menu-divider">
                    <button id="dark-btn" onclick="toggleDarkMode()">🌙 Dark Mode Toggle</button>
                    <button id="md-btn" onclick="toggleMarkdown()">📝 Split Markdown View</button>
                </div>
            </div>

            <!-- ====== 4. TOOLS MENU ====== -->
            <div class="dropdown">
                <button class="menu-trigger-btn">Tools ▾</button>
                <div class="dropdown-content menu-panel">
                    <button id="spell-btn" onclick="toggleSpellcheck()" class="active-toggle">✔️ Spellcheck Switcher</button>
                    <button onclick="speakText()">🔊 Speech Synthesis Reader</button>
                </div>
            </div>

            <!-- ====== QUICK FORMAT BAR ELEMENT ATTACHMENTS ====== -->
            <div class="inline-quick-tools">
                <select id="font-family-select" onchange="changeFontFamily(this.value)">
                    <option value="-apple-system, BlinkMacSystemFont, sans-serif">System Default</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Georgia, serif">Georgia</option>
                </select>

                <button onclick="changeFontSize('increase')" title="Increase font size">A+</button>
                <button onclick="changeFontSize('decrease')" title="Decrease font size">A-</button>

                <!-- Color Palette Context Menu Trigger -->
                <div class="dropdown">
                    <button class="menu-trigger-btn inner-tool">🎨 Colors</button>
                    <div class="dropdown-content color-menu">
                        <label>
                            <span>Text Color:</span>
                            <input type="color" id="text-color-picker" value="#333333" oninput="changeTextColor(this.value)">
                        </label>
                        <label>
                            <span>Highlight:</span>
                            <input type="color" id="highlight-color-picker" value="#ffffff" oninput="changeHighlightColor(this.value)">
                        </label>
                    </div>
                </div>

                <!-- Rich Element Insert Submenu Context -->
                <div class="dropdown" style="position: relative;">
                    <button class="menu-trigger-btn inner-tool" id="table-btn" onclick="toggleTableGridMenu(); event.stopPropagation();">➕ Insert Element</button>
                    <div class="dropdown-content insert-menu">
                        <button onclick="toggleTableGridMenu(); event.stopPropagation();">📊 Interactive Table Grid</button>
                        <button onclick="triggerImageUpload()">🖼️ Inline Image File</button>
                    </div>
                    <div id="table-grid-menu" class="grid-menu hidden">
                        <div id="grid-matrix" class="grid-matrix"></div>
                        <div id="grid-label" class="grid-label">1 x 1 Table</div>
                    </div>
                </div>
                <input type="file" id="image-file-input" style="display: none;" accept="image/*" onchange="handleImageFileSelect(this)">
            </div>
        </header>

        <!-- Dynamic Utility Find and Replace Action Control Workspace Layer -->
        <section class="find-replace-bar">
            <input type="text" id="find-input" placeholder="Find text...">
            <input type="text" id="replace-input" placeholder="Replace with...">
            <button onclick="findAndReplace()" class="btn-action">Replace All</button>
            
            <div class="goal-group">
                <label for="word-goal-input">Goal:</label>
                <input type="number" id="word-goal-input" placeholder="Words" min="0" oninput="updateMetrics()">
            </div>
        </section>

        <!-- Dynamic Word Goal Metric Tracker Progress Canvas Bar Layer -->
        <div id="goal-progress-container" class="hidden">
            <div id="goal-progress-bar"></div>
        </div>

        <!-- Primary Text Canvas Writing Area Core Processing Shell -->
        <main id="workspace-outer" class="workspace-wrapper bg-notepad">
            <div class="workspace">
                <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start typing your formatting rich text document context here..."></div>
                <div id="preview" class="hidden"></div>
            </div>
        </main>

        <!-- Footer Analytics Session Pipeline Layout Status Monitoring -->
        <footer class="status-bar">
            <span id="save-status">💾 Auto-saved</span>
            <span id="goal-status"></span>
            <span id="word-count">Words: 0</span>
            <span id="char-count">Characters: 0</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
