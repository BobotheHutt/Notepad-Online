<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad Online - Advanced Text Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="editor-container">
        <!-- Modern Streamlined Toolbar Layout -->
        <div class="toolbar">
            <!-- Group 1: Core History -->
            <div class="tool-group">
                <button onclick="format('undo')" title="Undo">↩️</button>
                <button onclick="format('redo')" title="Redo">↪️</button>
            </div>

            <!-- Group 2: Quick Style Toggles -->
            <div class="tool-group">
                <button onclick="format('bold')" title="Bold"><b>B</b></button>
                <button onclick="format('italic')" title="Italic"><i>I</i></button>
                <button onclick="format('underline')" title="Underline"><u>U</u></button>
                <button onclick="format('strikeThrough')" title="Strikethrough"><s>S</s></button>
            </div>

            <!-- Group 3: Font Configuration Dropdowns -->
            <div class="tool-group">
                <select id="font-family" onchange="changeFontFamily(this.value)" title="Font Family">
                    <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">System Default</option>
                    <option value="'Arial', sans-serif">Arial</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Georgia', serif">Georgia</option>
                </select>

                <button onclick="changeFontSize('increase')" title="Zoom In">A+</button>
                <button onclick="changeFontSize('decrease')" title="Zoom Out">A-</button>
            </div>
            
            <!-- Group 4: Integrated Dropdown Menus -->
            <div class="tool-group">
                <!-- Colors Dropdown -->
                <div class="dropdown">
                    <button class="dropbtn">🎨 Colors ▼</button>
                    <div class="dropdown-content color-menu">
                        <label>Text Color: <input type="color" id="text-color-picker" oninput="changeTextColor(this.value)" value="#333333"></label>
                        <label>Highlight: <input type="color" id="bg-color-picker" oninput="changeHighlightColor(this.value)" value="#ffffff"></label>
                    </div>
                </div>

                <!-- Alignment Dropdown -->
                <div class="dropdown">
                    <button class="dropbtn">▤ Align ▼</button>
                    <div class="dropdown-content">
                        <button onclick="format('justifyLeft')">Left Align</button>
                        <button onclick="format('justifyCenter')">Center Align</button>
                        <button onclick="format('justifyRight')">Right Align</button>
                        <button onclick="format('justifyFull')">Justify</button>
                    </div>
                </div>

                <!-- Media Insert Dropdown -->
                <div class="dropdown">
                    <button class="dropbtn">➕ Insert ▼</button>
                    <div class="dropdown-content insert-menu">
                        <button onclick="toggleTableGridMenu()" id="table-btn">📊 Table Grid</button>
                        <button onclick="triggerImageUpload()">图片 🖼️ Image File</button>
                    </div>
                    <!-- Nested Table Floating Selector Matrix -->
                    <div id="table-grid-menu" class="grid-menu hidden">
                        <div class="grid-matrix" id="grid-matrix"></div>
                        <div class="grid-label" id="grid-label">1 x 1 Table</div>
                    </div>
                </div>
            </div>

            <!-- Group 5: Productivity Utilities & View States -->
            <div class="tool-group">
                <select id="layout-view" onchange="changeLayoutView(this.value)" title="Document Layout">
                    <option value="notepad">Notepad Style</option>
                    <option value="page">Letter Page Style</option>
                </select>
                <button onclick="toggleDarkMode()" id="dark-btn">🌙 Dark Mode</button>
                <button onclick="toggleMarkdown()" id="md-btn">📝 Markdown View</button>
                <button onclick="toggleSpellcheck()" id="spell-btn" class="active-toggle">✔️ Spellcheck: ON</button>
                <button onclick="speakText()" title="Read Document Aloud">🔊 Read</button>
            </div>

            <!-- Group 6: File Actions & Clean Exports -->
            <div class="tool-group download-group">
                <button onclick="printDoc()" class="btn-action">🖨️ Print / PDF</button>
                <button onclick="saveFile('txt')" class="btn-save">Save .txt</button>
                <button onclick="saveFile('html')" class="btn-save">Save .html</button>
                <button onclick="clearDoc()" class="btn-danger">🗑️ Clear</button>
            </div>
        </div>

        <!-- Hidden native file picker hook -->
        <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageFileSelect(this)">

        <!-- Embedded Find and Replace Bar -->
        <div class="find-replace-bar">
            <input type="text" id="find-input" placeholder="Find text...">
            <input type="text" id="replace-input" placeholder="Replace with...">
            <button onclick="findAndReplace()">Replace All</button>
            <div class="goal-group">
                <label for="word-goal-input">Goal:</label>
                <input type="number" id="word-goal-input" placeholder="e.g. 500" min="0" oninput="updateMetrics()">
            </div>
        </div>

        <!-- Progress Metrics Bar for Word Targets -->
        <div id="goal-progress-container" class="hidden">
            <div id="goal-progress-bar"></div>
        </div>

        <!-- Workspace Wrapper -->
        <div class="workspace-wrapper bg-notepad" id="workspace-outer">
            <div class="workspace">
                <div id="editor" contenteditable="true" spellcheck="true" placeholder="Start typing or drop files here..."></div>
                <div id="preview" class="hidden"></div>
            </div>
        </div>

        <!-- Status Tracking Bar -->
        <div class="status-bar">
            <span id="save-status">💾 Auto-saved</span>
            <span id="goal-status"></span>
            <span id="word-count">Words: 0</span>
            <span id="char-count">Characters: 0</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
