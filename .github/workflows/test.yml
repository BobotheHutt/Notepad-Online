# Runs the tests named, in Chromium, Firefox and WebKit, when started by hand
# (Actions → Tests → Run workflow): only the ones a change affects, for what
# the machine it was made on cannot run (Firefox and WebKit). Not on every
# push: that ran everything, every time. Leave the box empty to run them all.
name: Tests
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Test files to run, separated by spaces (e.g. tests/pdf.spec.mjs); empty runs them all
        type: string
        default: ''
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test $TESTS
        env:
          TESTS: ${{ inputs.tests }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
