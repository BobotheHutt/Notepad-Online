<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <!-- Security policy: only the app's own scripts run, and the only outside
       site is the font CDN. Styles stay open: documents carry inline styles.
       (A meta tag, as GitHub Pages cannot send headers.) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob: https://cdn.jsdelivr.net; connect-src 'self' data: blob: https://cdn.jsdelivr.net https://files.noteshack.org; worker-src 'self' blob:; frame-src 'self' blob:; media-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Noteshack</title>
  <meta name="description" content="A free, private word processor and PDF editor that runs in your browser. Edit PDFs and scans, fill forms, open and save Word files. Works offline; nothing is uploaded.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="js/boot.js"></script>
  <style id="page-rule"></style>
</head>
<body class="view-page">
<noscript>
  <div class="noscript">
    <div class="noscript-card">
      <h2>Noteshack needs JavaScript</h2>
      <p>Noteshack is a word processor and PDF editor that runs entirely in your browser, so it needs JavaScript turned on for this site.</p>
      <p>That is also why your documents stay private: nothing you write or open is sent anywhere. The only code that runs is Noteshack's own; there are no ads, trackers or analytics.</p>
    </div>
  </div>
</noscript>
<div class="app" id="app">

  <!-- ===================== Documents panel ===================== -->
  <aside class="sidebar" id="sidebar" aria-label="Documents">
    <div class="sb-head">
      <h1 class="brand"><img src="icon.svg" alt="" width="22" height="22"> Noteshack</h1>
      <button class="btn btn-primary btn-sm" data-action="new" title="New document (Ctrl+Alt+N)"><span data-icon="plus"></span>New</button>
    </div>
    <div class="sb-search">
      <span data-icon="search" class="sb-search-icon"></span>
      <input id="doc-search" type="search" placeholder="Search documents" aria-label="Search documents" autocomplete="off">
    </div>
    <ul class="doc-list" id="doc-list"></ul>
    <div class="sb-foot" id="sb-foot">
      <span id="storage-note">Saved in this browser</span>
      <button class="link-btn" data-action="backup">Back up</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="toggle-sidebar"></div>

  <!-- ===================== Main column ===================== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" data-action="toggle-sidebar" data-icon="sidebar" title="Documents" aria-label="Show or hide documents"></button>
      <div class="title-block">
        <input id="doc-title" class="doc-title" type="text" spellcheck="false" placeholder="Untitled document" aria-label="Document title" maxlength="120">
        <nav class="menubar" id="menubar" role="menubar" aria-label="Main menu">

          <div class="menu">
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">File</button>
            <div class="menu-pop" role="menu">
              <button role="menuitem" data-action="new"><span>New document</span><kbd>Ctrl+Alt+N</kbd></button>
              <button role="menuitem" data-action="open"><span>Open file…</span><kbd>Ctrl+O</kbd></button>
              <button role="menuitem" data-action="save" id="save-item"><span>Save</span><kbd>Ctrl+S</kbd></button>
              <button role="menuitem" data-action="save-as"><span>Save as…</span><kbd>Ctrl+Shift+S</kbd></button>
              <button role="menuitem" data-action="export"><span>Export…</span></button>
              <button role="menuitem" data-action="duplicate"><span>Make a copy</span></button>
              <button role="menuitem" data-action="rename"><span>Rename</span></button>
              <button data-doc-only role="menuitem" data-action="history"><span>Version history</span></button>
              <div class="menu-sep"></div>
              <button data-doc-only role="menuitem" data-action="page-setup"><span>Page setup…</span></button>
              <button role="menuitem" data-action="print"><span>Print</span><kbd>Ctrl+P</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="backup"><span>Back up all documents</span></button>
              <button role="menuitem" data-action="restore-backup"><span>Restore from backup…</span></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="delete" class="danger"><span>Delete document</span></button>
            </div>
          </div>

          <div class="menu">
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">Edit</button>
            <div class="menu-pop" role="menu">
              <button role="menuitem" data-action="cmd" data-arg="undo"><span>Undo</span><kbd>Ctrl+Z</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="redo"><span>Redo</span><kbd>Ctrl+Y</kbd></button>
              <div class="menu-sep" data-doc-only></div>
              <button data-doc-only role="menuitem" data-action="select-all"><span>Select all</span><kbd>Ctrl+A</kbd></button>
              <div class="menu-sep" data-doc-only></div>
              <button data-doc-only role="menuitem" data-action="find"><span>Find</span><kbd>Ctrl+F</kbd></button>
              <button data-doc-only role="menuitem" data-action="replace"><span>Find and replace</span><kbd>Ctrl+H</kbd></button>
              <div class="menu-sep" data-doc-only></div>
              <div class="menu-note" data-doc-only>Paste without formatting: <kbd>Ctrl+Shift+V</kbd></div>
            </div>
          </div>

          <div class="menu" data-pdf-only>
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">Pages</button>
            <div class="menu-pop" role="menu">
              <button role="menuitem" data-action="pdf-rotate" data-arg="-1"><span>Rotate page left</span></button>
              <button role="menuitem" data-action="pdf-rotate" data-arg="1"><span>Rotate page right</span></button>
              <button role="menuitem" data-action="pdf-delete-page" class="danger"><span>Delete page</span></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="pdf-blank"><span>Insert blank page</span></button>
              <button role="menuitem" data-action="pdf-add"><span>Add pages from another PDF…</span></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="pdf-ocr" data-arg="scanned"><span>Read the whole document (OCR)</span></button>
              <button role="menuitem" data-action="pdf-ocr" data-arg="current"><span>Read text on this page</span></button>
              <button role="menuitem" data-action="pdf-convert"><span>Make this page’s text editable</span></button>
              <button role="menuitem" data-action="pdf-unconvert"><span>Keep this page as scanned</span></button>
              <button role="menuitem" data-action="pdf-original"><span>Show or hide the original scan</span></button>
              <button role="menuitem" data-action="pdf-scan-fonts"><span>Use the scan’s own letters, or the matched fonts</span></button>
              <button role="menuitem" data-action="pdf-copy-text"><span>Copy text from this page</span></button>
              <div class="menu-note">These act on the page in view. Each page thumbnail has its own buttons too.</div>
            </div>
          </div>

          <div class="menu" data-doc-only>
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">Insert</button>
            <div class="menu-pop" role="menu">
              <button role="menuitem" data-action="image"><span>Image from your device…</span></button>
              <button role="menuitem" data-action="image-url"><span>Image from a link…</span></button>
              <button role="menuitem" data-action="table-menu"><span>Table…</span></button>
              <button role="menuitem" data-action="link"><span>Link…</span><kbd>Ctrl+K</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="checklist"><span>Checklist</span><kbd>Ctrl+Shift+9</kbd></button>
              <button role="menuitem" data-action="hr"><span>Horizontal line</span></button>
              <button role="menuitem" data-action="page-break"><span>Page break</span><kbd>Ctrl+Enter</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="date"><span>Today's date</span></button>
              <button role="menuitem" data-action="symbols"><span>Special character…</span></button>
            </div>
          </div>

          <div class="menu" data-doc-only>
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">Format</button>
            <div class="menu-pop" role="menu">
              <button role="menuitem" data-action="cmd" data-arg="bold"><span>Bold</span><kbd>Ctrl+B</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="italic"><span>Italic</span><kbd>Ctrl+I</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="underline"><span>Underline</span><kbd>Ctrl+U</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="strikeThrough"><span>Strikethrough</span><kbd>Ctrl+Shift+X</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="superscript"><span>Superscript</span><kbd>Ctrl+.</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="subscript"><span>Subscript</span><kbd>Ctrl+,</kbd></button>
              <button role="menuitem" data-action="inline-code"><span>Inline code</span><kbd>Ctrl+E</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="block" data-arg="p"><span>Normal text</span><kbd>Ctrl+Alt+0</kbd></button>
              <button role="menuitem" data-action="block" data-arg="h1"><span>Heading 1</span><kbd>Ctrl+Alt+1</kbd></button>
              <button role="menuitem" data-action="block" data-arg="h2"><span>Heading 2</span><kbd>Ctrl+Alt+2</kbd></button>
              <button role="menuitem" data-action="block" data-arg="h3"><span>Heading 3</span><kbd>Ctrl+Alt+3</kbd></button>
              <button role="menuitem" data-action="block" data-arg="blockquote"><span>Quote</span></button>
              <button role="menuitem" data-action="block" data-arg="pre"><span>Code block</span></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="cmd" data-arg="justifyLeft"><span>Align left</span><kbd>Ctrl+Shift+L</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="justifyCenter"><span>Align center</span><kbd>Ctrl+Shift+E</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="justifyRight"><span>Align right</span><kbd>Ctrl+Shift+R</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="justifyFull"><span>Justify</span><kbd>Ctrl+Shift+J</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="cmd" data-arg="insertUnorderedList"><span>Bulleted list</span><kbd>Ctrl+Shift+8</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="insertOrderedList"><span>Numbered list</span><kbd>Ctrl+Shift+7</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="indent"><span>Increase indent</span><kbd>Tab</kbd></button>
              <button role="menuitem" data-action="cmd" data-arg="outdent"><span>Decrease indent</span><kbd>Shift+Tab</kbd></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="clear-format"><span>Clear formatting</span><kbd>Ctrl+\</kbd></button>
            </div>
          </div>

          <div class="menu">
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">View</button>
            <div class="menu-pop" role="menu">
              <button data-doc-only role="menuitemradio" data-action="view" data-arg="page" data-check="view:page"><span>Page layout</span></button>
              <button data-doc-only role="menuitemradio" data-action="view" data-arg="full" data-check="view:full"><span>Full width</span></button>
              <div class="menu-sep" data-doc-only></div>
              <button role="menuitemradio" data-action="theme" data-arg="light" data-check="theme:light"><span>Light</span></button>
              <button role="menuitemradio" data-action="theme" data-arg="dark" data-check="theme:dark"><span>Dark</span></button>
              <button role="menuitemradio" data-action="theme" data-arg="system" data-check="theme:system"><span>Match my device</span></button>
              <div class="menu-sep"></div>
              <button role="menuitem" data-action="zoom" data-arg="in"><span>Zoom in</span></button>
              <button role="menuitem" data-action="zoom" data-arg="out"><span>Zoom out</span></button>
              <button role="menuitem" data-action="zoom" data-arg="reset"><span>Actual size</span></button>
              <div class="menu-sep"></div>
              <button role="menuitemcheckbox" data-action="toggle-sidebar" data-check="sidebar"><span>Documents panel</span></button>
              <button role="menuitem" data-action="focus"><span>Focus mode</span><kbd>Ctrl+Shift+F</kbd></button>
            </div>
          </div>

          <div class="menu">
            <button class="menu-btn" role="menuitem" aria-haspopup="true" aria-expanded="false">Tools</button>
            <div class="menu-pop" role="menu">
              <button data-doc-only role="menuitem" data-action="word-count"><span>Word count</span><kbd>Ctrl+Shift+C</kbd></button>
              <button data-doc-only role="menuitem" data-action="goal"><span>Word goal…</span></button>
              <button role="menuitem" data-action="translate"><span>Translate…</span></button>
              <div class="menu-sep" data-doc-only></div>
              <button data-doc-only role="menuitem" data-action="speak"><span id="speak-label">Read aloud</span></button>
              <button data-doc-only role="menuitem" data-action="voice"><span>Voice settings…</span></button>
              <div class="menu-sep" data-doc-only></div>
              <button data-doc-only role="menuitemcheckbox" data-action="spellcheck" data-check="spellcheck"><span>Spell check</span></button>
              <button data-doc-only role="menuitemcheckbox" data-action="smart-md" data-check="smartMd"><span>Markdown shortcuts</span></button>
              <div class="menu-sep" data-doc-only></div>
              <button role="menuitem" data-action="shortcuts"><span>Keyboard shortcuts</span><kbd>Ctrl+/</kbd></button>
              <button role="menuitem" data-action="about"><span>About and storage</span></button>
            </div>
          </div>
        </nav>
      </div>
      <div class="top-right">
        <span class="save-status" id="save-status" role="status" aria-live="polite">Saved</span>
        <button class="icon-btn" data-action="toggle-theme" id="theme-btn" title="Switch light or dark" aria-label="Switch light or dark" data-icon="moon"></button>
        <button class="icon-btn" data-action="focus" data-icon="focus" title="Focus mode (Ctrl+Shift+F)" aria-label="Focus mode"></button>
      </div>
    </header>

    <!-- the toolbars, as one landmark (display: contents, so layout is unchanged) -->
    <div class="bars" role="region" aria-label="Toolbars">
    <!-- ===================== Formatting toolbar ===================== -->
    <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting" data-doc-only>
      <button class="tb" data-action="cmd" data-arg="undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="tb" data-action="cmd" data-arg="redo" data-icon="redo" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
      <span class="tb-sep"></span>
      <select id="tb-block" class="tb-select tb-block" title="Paragraph style" aria-label="Paragraph style">
        <option value="p">Normal text</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="blockquote">Quote</option>
        <option value="pre">Code block</option>
      </select>
      <select id="tb-font" class="tb-select tb-font" title="Font" aria-label="Font"></select>
      <select id="tb-size" class="tb-select tb-size" title="Font size" aria-label="Font size"></select>
      <span class="tb-sep"></span>
      <button class="tb" data-action="cmd" data-arg="bold" data-state="bold" data-icon="bold" title="Bold (Ctrl+B)" aria-label="Bold"></button>
      <button class="tb" data-action="cmd" data-arg="italic" data-state="italic" data-icon="italic" title="Italic (Ctrl+I)" aria-label="Italic"></button>
      <button class="tb" data-action="cmd" data-arg="underline" data-state="underline" data-icon="underline" title="Underline (Ctrl+U)" aria-label="Underline"></button>
      <button class="tb" data-action="cmd" data-arg="strikeThrough" data-state="strikeThrough" data-icon="strike" title="Strikethrough (Ctrl+Shift+X)" aria-label="Strikethrough"></button>
      <button class="tb tb-color" data-action="color-menu" data-arg="fore" data-icon="color" title="Text color" aria-label="Text color"><span class="color-bar" id="fore-bar"></span></button>
      <button class="tb tb-color" data-action="color-menu" data-arg="back" data-icon="highlight" title="Highlight color" aria-label="Highlight color"><span class="color-bar" id="back-bar"></span></button>
      <span class="tb-sep"></span>
      <button class="tb" data-action="link" data-icon="link" title="Insert link (Ctrl+K)" aria-label="Insert link"></button>
      <button class="tb" data-action="image" data-icon="image" title="Insert image" aria-label="Insert image"></button>
      <button class="tb" data-action="table-menu" data-icon="table" title="Insert table" aria-label="Insert table"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-action="cmd" data-arg="justifyLeft" data-state="justifyLeft" data-icon="alignLeft" title="Align left (Ctrl+Shift+L)" aria-label="Align left"></button>
      <button class="tb" data-action="cmd" data-arg="justifyCenter" data-state="justifyCenter" data-icon="alignCenter" title="Align center (Ctrl+Shift+E)" aria-label="Align center"></button>
      <button class="tb" data-action="cmd" data-arg="justifyRight" data-state="justifyRight" data-icon="alignRight" title="Align right (Ctrl+Shift+R)" aria-label="Align right"></button>
      <button class="tb" data-action="cmd" data-arg="justifyFull" data-state="justifyFull" data-icon="alignJustify" title="Justify (Ctrl+Shift+J)" aria-label="Justify"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-action="cmd" data-arg="insertUnorderedList" data-state="insertUnorderedList" data-icon="bullets" title="Bulleted list (Ctrl+Shift+8)" aria-label="Bulleted list"></button>
      <button class="tb" data-action="cmd" data-arg="insertOrderedList" data-state="insertOrderedList" data-icon="numbers" title="Numbered list (Ctrl+Shift+7)" aria-label="Numbered list"></button>
      <button class="tb" data-action="checklist" data-state="checklist" data-icon="checklist" title="Checklist (Ctrl+Shift+9)" aria-label="Checklist"></button>
      <button class="tb" data-action="cmd" data-arg="outdent" data-icon="outdent" title="Decrease indent (Shift+Tab)" aria-label="Decrease indent"></button>
      <button class="tb" data-action="cmd" data-arg="indent" data-icon="indent" title="Increase indent (Tab)" aria-label="Increase indent"></button>
      <span class="tb-sep"></span>
      <button class="tb" data-action="clear-format" data-icon="clear" title="Clear formatting (Ctrl+\)" aria-label="Clear formatting"></button>
    </div>

    <!-- ===================== PDF toolbar ===================== -->
    <div class="toolbar pdf-toolbar" id="pdf-toolbar" role="toolbar" aria-label="PDF tools" data-pdf-only>
      <button class="tb pdf-pages-btn" data-pdf="pages" data-icon="sidebar" title="Pages" aria-label="Show pages"></button>
      <button class="tb" data-pdf="undo" data-icon="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="tb" data-pdf="redo" data-icon="redo" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
      <span class="tb-sep"></span>
      <button class="tb tb-label" data-pdf-tool="select" data-icon="pointer" title="Select and move (V)">Select</button>
      <button class="tb tb-label" data-pdf-tool="edit" data-icon="textCursor" title="Change the PDF's own text (E)">Edit text</button>
      <button class="tb tb-label" data-pdf-tool="text" data-icon="type" title="Add new text (T)">Add text</button>
      <button class="tb" data-pdf-tool="highlight" data-icon="highlight" title="Highlight (H)" aria-label="Highlight"></button>
      <button class="tb" data-pdf-tool="whiteout" data-icon="eraser" title="White-out: cover something up (W)" aria-label="White-out"></button>
      <button class="tb" data-pdf-tool="draw" data-icon="pen" title="Draw (D)" aria-label="Draw"></button>
      <button class="tb" data-pdf-tool="box" data-icon="square" title="Box (B)" aria-label="Box"></button>
      <button class="tb" data-pdf="image" data-icon="image" title="Add an image" aria-label="Add an image"></button>
      <button class="tb tb-label" data-pdf="sign" data-icon="signature" title="Add your signature">Sign</button>
      <span class="tb-group" id="pdf-readall-wrap" hidden><label class="tb-toggle" for="pdf-readall"><input type="checkbox" class="switch" id="pdf-readall" role="switch"> Read whole document</label>
      <button type="button" class="tb tb-info" aria-label="What Read whole document does" aria-describedby="pdf-readall-tip">i<span class="tb-tip" id="pdf-readall-tip" role="tooltip"><strong>Off:</strong> a scanned page is read when you click it with Edit text, and only that page. Nothing else is read, so large documents open and stay quick.<br><br><strong>On:</strong> every scanned page is read in the background, several at a time, so the whole document becomes editable, searchable and copyable. A page you click goes first. Turning it off pauses; it carries on where it stopped next time. It works the computer harder while it runs.</span></button></span>
      <button class="tb tb-label" data-pdf="original" hidden aria-pressed="false" title="Show the pages as they were scanned, to check what was read">Original</button>
      <span class="grow"></span>
      <button class="tb" data-pdf="zoom-out" data-icon="zoomOut" title="Zoom out" aria-label="Zoom out"></button>
      <span class="pdf-zoom" id="pdf-zoom">100%</span>
      <button class="tb" data-pdf="zoom-in" data-icon="zoomIn" title="Zoom in" aria-label="Zoom in"></button>
      <button class="btn btn-primary btn-sm pdf-download" data-action="save" title="Save (Ctrl+S)"><span data-icon="save"></span>Save</button>
    </div>
    </div>

    <!-- ===================== PDF pages ===================== -->
    <main class="stage pdf-stage" id="pdf-stage" data-pdf-only data-tool="select">
      <aside class="pdf-thumbs" id="pdf-thumbs" aria-label="Pages">
        <ol class="pdf-thumb-list" id="pdf-thumb-list"></ol>
        <div class="pdf-thumb-foot">
          <button class="btn btn-sm" data-action="pdf-blank"><span data-icon="plus"></span>Blank page</button>
          <button class="btn btn-sm" data-action="pdf-add"><span data-icon="filePlus"></span>Add PDF…</button>
        </div>
      </aside>
      <div class="pdf-scroller" id="pdf-scroller" tabindex="0" role="region" aria-label="PDF pages">
        <div class="pdf-pages" id="pdf-pages"></div>
      </div>
      <!-- Style of the selected item or the active tool; floats so the page never jumps -->
      <div class="ctxbar pdf-style" id="pdf-style" role="toolbar" aria-label="Style" hidden></div>
    </main>

    <!-- ===================== Writing area ===================== -->
    <main class="stage" data-doc-only>
      <div class="scroller" id="workspace" tabindex="0" role="region" aria-label="Document page">
        <div class="page" id="page">
          <div id="editor" class="editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Document" data-placeholder="Start writing…"></div>
        </div>
        <div class="img-frame" id="img-frame" hidden><span class="img-handle" id="img-handle" title="Drag to resize"></span></div>
      </div>
      <div class="find" id="find" hidden role="search" aria-label="Find and replace">
        <div class="find-row">
          <input id="find-q" type="text" placeholder="Find" aria-label="Find" autocomplete="off" spellcheck="false">
          <span class="find-count" id="find-count"></span>
          <button class="icon-btn sm" data-action="find-prev" data-icon="up" title="Previous (Shift+Enter)" aria-label="Previous match"></button>
          <button class="icon-btn sm" data-action="find-next" data-icon="down" title="Next (Enter)" aria-label="Next match"></button>
          <button class="icon-btn sm" data-action="find-close" data-icon="close" title="Close (Esc)" aria-label="Close find"></button>
        </div>
        <div class="find-row">
          <input id="find-r" type="text" placeholder="Replace with" aria-label="Replace with" autocomplete="off" spellcheck="false">
          <button class="btn btn-sm" data-action="replace-one">Replace</button>
          <button class="btn btn-sm" data-action="replace-all">All</button>
        </div>
        <div class="find-opts">
          <label class="chip"><input type="checkbox" id="find-case"> Match case</label>
          <label class="chip"><input type="checkbox" id="find-word"> Whole words</label>
          <label class="chip"><input type="checkbox" id="find-regex"> Regex</label>
        </div>
      </div>

      <!-- Checking a translation: the original of the paragraph at the cursor -->
      <div class="review" id="review" hidden role="region" aria-label="Check the translation">
        <div class="review-head">
          <strong>Check the translation</strong>
          <span class="review-count" id="review-count"></span>
          <button class="icon-btn sm" data-action="review-prev" data-icon="up" title="Previous paragraph to check" aria-label="Previous paragraph to check"></button>
          <button class="icon-btn sm" data-action="review-next" data-icon="down" title="Next paragraph to check" aria-label="Next paragraph to check"></button>
        </div>
        <div class="review-label">Original <span class="muted">(you can change it, then translate again)</span></div>
        <div class="review-orig" id="review-orig" spellcheck="true" aria-label="Original of this paragraph"></div>
        <div class="review-actions">
          <button class="btn btn-sm" data-action="review-redo" data-needs-node>Translate again</button>
          <button class="btn btn-sm btn-primary" data-action="review-ok" data-needs-node>Looks right</button>
          <span class="grow"></span>
          <button class="btn btn-sm" data-action="review-done">Done</button>
        </div>
      </div>

      <!-- Tools for the image, link or table the cursor is in -->
      <div class="ctxbar" id="ctxbar" hidden></div>
      <div class="drop-hint" id="drop-hint" hidden>Drop to insert</div>
    </main>

    <!-- ===================== Status bar ===================== -->
    <footer class="statusbar" id="statusbar">
      <button class="sb-btn speak-pill" id="sb-speak" data-action="speak" hidden><span data-icon="stop"></span>Stop reading</button>
      <span class="grow"></span>
      <button class="sb-btn" data-doc-only id="sb-goal" data-action="goal" title="Word goal">
        <span id="goal-text">Set a goal</span>
        <span class="goal-meter" id="goal-meter" hidden><span id="goal-fill"></span></span>
      </button>
      <button class="sb-btn" data-doc-only id="sb-count" data-action="word-count" title="Word count (Ctrl+Shift+C)">0 words</button>
      <span class="sb-item sb-hide-sm" data-doc-only id="sb-read"></span>
      <span class="sb-item sb-hide-sm" data-doc-only id="sb-pages"></span>
      <span class="sb-item" id="sb-pdf" data-pdf-only></span>
      <button class="sb-btn" id="sb-lang" data-action="doc-lang" title="Language of this document">English</button>
      <button class="sb-btn" id="sb-zoom" data-action="zoom" data-arg="reset" title="Zoom (click for actual size)">100%</button>
    </footer>
  </div>
</div>

<button class="focus-exit" id="focus-exit" data-action="focus" title="Leave focus mode (Esc)">Exit focus</button>
<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file-open" accept=".pdf,.docx,.md,.markdown,.txt,.text,.html,.htm,.jpg,.jpeg,.png,.webp,.tif,.tiff,.bmp,application/pdf,text/plain,text/markdown,text/html,image/jpeg,image/png,image/webp,image/tiff,image/bmp" hidden multiple>
<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="pdf-image-input" accept="image/*" hidden>
<input type="file" id="pdf-add-input" accept=".pdf,application/pdf" hidden multiple>
<input type="file" id="file-backup" accept=".json,application/json" hidden>

<script src="js/icons.js"></script>
<script src="js/sanitize.js"></script>
<script src="js/markdown.js"></script>
<script src="js/zip.js"></script>
<script src="js/docx.js"></script>
<script src="js/store.js"></script>
<script src="js/fonts.js"></script>
<script src="js/lang.js"></script>
<script src="js/spell.js"></script>
<script src="js/translate.js"></script>
<script src="js/pdf.js"></script>
<script src="js/images.js"></script>
<script src="js/app.js"></script>
</body>
</html>
